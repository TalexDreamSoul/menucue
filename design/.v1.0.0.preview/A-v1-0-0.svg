<text x="24.0" y="70.2" font-family="Inter" font-size="12" font-weight="normal" letter-spacing="0" fill="#A6A7AF">分类的问题不是名字不好听，而是同一件事被放在两个地方、两件事被塞进一个地方。下面每一项都能在源码里找到证据。</text>
