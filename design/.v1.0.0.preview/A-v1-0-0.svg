<text x="118.2" y="1132.7" font-family="Inter" font-size="11.5" font-weight="500" letter-spacing="0" fill="#A6A7AF">时间与区域 / 通用 › iCloud</text>
<text x="24.0" y="1169.3" font-family="Inter" font-size="13" font-weight="600" letter-spacing="0" fill="#F5F5F7">v1.0.0 新增的界面元素（源码中不存在，属提案）</text>
