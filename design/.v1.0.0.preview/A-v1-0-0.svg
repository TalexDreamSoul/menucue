<text x="44.0" y="1193.7" font-family="Inter" font-size="11.5" font-weight="500" letter-spacing="0" fill="#F5F5F7">提醒规则 › 全局启用</text>
<text x="44.0" y="1212.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">源码只有逐渠道、逐规则开关，没有总开关。</text>
