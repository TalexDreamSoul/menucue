<text x="24.0" y="71.2" font-family="Inter" font-size="12" font-weight="normal" letter-spacing="0" fill="#A6A7AF">分类的问题不是名字不好听，而是同一件事被放在两个地方、两件事被塞进一个地方。下面每一项都能在源码里找到证据。</text>
<text x="26.0" y="109.4" font-family="Inter" font-size="14" font-weight="600" letter-spacing="0" fill="#FF453A">现状 · 3 组 10 项</text>
<text x="24.0" y="139.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">分组按实现层划分，同一件事被拆到不同组，跨组语义互相污染。</text>
