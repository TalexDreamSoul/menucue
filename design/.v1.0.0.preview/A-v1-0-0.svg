<text x="626.5" y="372.2" font-family="Inter" font-size="12" font-weight="500" letter-spacing="0" fill="#F5F5F7">动作库</text>
<text x="670.5" y="372.1" font-family="Inter" font-size="11" font-weight="note" letter-spacing="0" fill="#90919A">原「操作中心」；被三方引用</text>
