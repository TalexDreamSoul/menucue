<text x="44.0" y="1254.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">展示动作被哪些规则/快捷键引用。</text>
<rect x="25.8" y="1266.8" width="8.4" height="8.4" rx="2" fill="none" stroke="#0A84FF" stroke-width="1" stroke-dasharray="2 2"/>
