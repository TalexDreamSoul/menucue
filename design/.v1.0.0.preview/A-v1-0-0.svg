<rect x="616.5" y="367.0" width="539.5" height="26.0" rx="6" fill="#1B1C21"/>
<text x="626.5" y="384.2" font-family="Inter" font-size="12" font-weight="500" letter-spacing="0" fill="#F5F5F7">动作库</text>
<text x="670.5" y="384.1" font-family="Inter" font-size="11" font-weight="note" letter-spacing="0" fill="#90919A">原「操作中心」；被三方引用</text>
<text x="618.5" y="419.1" font-family="Inter" font-size="11" font-weight="600" letter-spacing="0" fill="#0A84FF">提醒</text>
<rect x="616.5" y="430.0" width="539.5" height="26.0" rx="6" fill="#1B1C21"/>
<text x="626.5" y="447.2" font-family="Inter" font-size="12" font-weight="500" letter-spacing="0" fill="#F5F5F7">提醒规则</text>
