<text x="626.5" y="584.2" font-family="Inter" font-size="12" font-weight="500" letter-spacing="0" fill="#F5F5F7">关于</text>
<rect x="24.0" y="610.0" width="1132.0" height="1.0" rx="0" fill="#3A3B42"/>
<text x="24.0" y="643.3" font-family="Inter" font-size="13" font-weight="600" letter-spacing="0" fill="#F5F5F7">六处修正</text>
<rect x="25.8" y="655.8" width="8.4" height="8.4" rx="2" fill="none" stroke="#32D74B" stroke-width="1" stroke-dasharray="2 2"/>
<text x="44.0" y="666.6" font-family="Inter" font-size="11.5" font-weight="500" letter-spacing="0" fill="#F5F5F7">操作中心 → 动作库</text>
<text x="44.0" y="684.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">它被面板、手势、快捷键共同引用，与外观无关；与触控板/快捷键同组。</text>
<rect x="25.8" y="695.8" width="8.4" height="8.4" rx="2" fill="none" stroke="#32D74B" stroke-width="1" stroke-dasharray="2 2"/>
<text x="44.0" y="706.6" font-family="Inter" font-size="11.5" font-weight="500" letter-spacing="0" fill="#F5F5F7">提醒规则 → 提醒组</text>
<text x="44.0" y="724.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">它读取系统观测值并向外投递，不采集用户输入。</text>
<rect x="25.8" y="735.8" width="8.4" height="8.4" rx="2" fill="none" stroke="#32D74B" stroke-width="1" stroke-dasharray="2 2"/>
<text x="44.0" y="746.6" font-family="Inter" font-size="11.5" font-weight="500" letter-spacing="0" fill="#F5F5F7">动效 → 通用 › 外观</text>
<text x="44.0" y="764.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">它影响整个应用（含设置窗口），不属于面板。</text>
<rect x="25.8" y="775.8" width="8.4" height="8.4" rx="2" fill="none" stroke="#32D74B" stroke-width="1" stroke-dasharray="2 2"/>
<text x="44.0" y="786.6" font-family="Inter" font-size="11.5" font-weight="500" letter-spacing="0" fill="#F5F5F7">系统时区 → 时间与区域</text>
<text x="44.0" y="804.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">原先藏在菜单栏页，属机器级设置。</text>
<rect x="25.8" y="815.8" width="8.4" height="8.4" rx="2" fill="none" stroke="#32D74B" stroke-width="1" stroke-dasharray="2 2"/>
<text x="44.0" y="826.6" font-family="Inter" font-size="11.5" font-weight="500" letter-spacing="0" fill="#F5F5F7">macOS 语言地区 → 时间与区域</text>
<text x="44.0" y="844.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">原先混在通用页，与同步/更新无关。</text>
<rect x="25.8" y="855.8" width="8.4" height="8.4" rx="2" fill="none" stroke="#32D74B" stroke-width="1" stroke-dasharray="2 2"/>
<text x="44.0" y="866.6" font-family="Inter" font-size="11.5" font-weight="500" letter-spacing="0" fill="#F5F5F7">通用不再当垃圾桶</text>
<text x="44.0" y="884.1" font-family="Inter" font-size="11" font-weight="normal" letter-spacing="0" fill="#90919A">只保留启动、更新、外观、iCloud 四件事。</text>
