<text x="670.5" y="322.1" font-family="Inter" font-size="11" font-weight="note" letter-spacing="0" fill="#90919A">手势规则 = 触发器 → 动作</text>
<rect x="616.5" y="336.0" width="539.5" height="26.0" rx="6" fill="#1B1C21"/>
<text x="626.5" y="353.2" font-family="Inter" font-size="12" font-weight="500" letter-spacing="0" fill="#F5F5F7">快捷键</text>
