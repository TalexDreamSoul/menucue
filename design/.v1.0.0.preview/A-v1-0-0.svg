<rect x="616.5" y="416.0" width="539.5" height="25.0" rx="6" fill="#1B1C21"/>
<text x="626.5" y="433.2" font-family="Inter" font-size="12" font-weight="500" letter-spacing="0" fill="#F5F5F7">提醒规则</text>
